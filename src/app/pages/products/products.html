<section class="max-w-7xl mx-auto px-4 py-12">
  <!-- Título -->
  <h1 class="text-3xl font-bold text-gray-800 mb-8">Nuestros Productos</h1>

  <!-- Categorías -->
  <div class="flex flex-wrap gap-3 mb-10">
    <button
      (click)="filterByCategory(null)"
      class="px-4 py-2 rounded-full text-sm font-medium border"
      [class.bg-black]="!selectedCategory"
      [class.text-white]="!selectedCategory"
    >
      Todos
    </button>

    <button
      *ngFor="let category of categories"
      (click)="filterByCategory(category)"
      class="px-4 py-2 rounded-full text-sm font-medium border capitalize"
      [class.bg-black]="selectedCategory === category"
      [class.text-white]="selectedCategory === category"
    >
      {{ category }}
    </button>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="text-center py-10 text-gray-500">
    Cargando productos...
  </div>

  <!-- PRODUCTS -->
  <div *ngIf="!loading && products.length > 0"
       class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    <div *ngFor="let product of products"
         class="bg-white rounded-xl shadow hover:shadow-xl transition overflow-hidden">

      <!-- Imagen -->
      <img
        [src]="product.image_url || '/assets/placeholder.png'"
        alt="{{ product.name }}"
        class="w-full h-48 object-cover rounded mb-4"
      />

      <!-- Info -->
      <div class="p-5 flex flex-col h-full">
        <h3 class="text-lg font-semibold text-gray-800 mb-1">
          {{ product.name }}
        </h3>

        <p class="text-sm text-gray-500 mb-4">
          {{ product.description }}
        </p>

        <div class="mt-auto">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xl font-bold text-green-600">
              Bs {{ product.price_b2c }}
            </span>

            <span
              class="text-xs px-2 py-1 rounded-full"
              [class.bg-green-100]="product.stock > 0"
              [class.text-green-700]="product.stock > 0"
              [class.bg-red-100]="product.stock === 0"
              [class.text-red-700]="product.stock === 0"
            >
              {{ product.stock > 0 ? 'Disponible' : 'Agotado' }}
            </span>
          </div>

          <button
            class="w-full bg-black text-white py-2 rounded-lg text-sm hover:bg-gray-800 transition"
          >
            Consultar por WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- EMPTY -->
  <div *ngIf="!loading && products.length === 0"
       class="text-center py-10 text-gray-500">
    No hay productos disponibles
  </div>
</section>
