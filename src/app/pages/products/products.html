<section class="max-w-7xl mx-auto px-4 py-10">
  
  <!-- Título -->
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Productos
  </h1>

  <!-- Categorías -->
  <div class="flex flex-wrap gap-3 mb-8">
    <button
      (click)="filterByCategory(null)"
      class="px-4 py-2 rounded-full border text-sm transition"
      [class.bg-black]="!selectedCategory"
      [class.text-white]="!selectedCategory"
    >
      Todos
    </button>

    <button
      *ngFor="let category of categories"
      (click)="filterByCategory(category)"
      class="px-4 py-2 rounded-full border text-sm capitalize transition"
      [class.bg-black]="selectedCategory === category"
      [class.text-white]="selectedCategory === category"
    >
      {{ category }}
    </button>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="text-gray-500">
    Cargando productos...
  </div>

  <!-- Grid -->
  <div
    *ngIf="!loading"
    class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
  >
    <ng-container *ngFor="let product of products">
      <div class="bg-white border rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition">
        <!-- Imagen -->
        <img
          [src]="product.image_Url"
          alt="{{ product.name }}"
          class="w-full h-48 object-cover"
        />

        <!-- Contenido -->
        <div class="p-5 space-y-3">
          <h2 class="text-lg font-semibold text-gray-900">
            {{ product.name }}
          </h2>

          <p class="text-sm text-gray-600 line-clamp-2">
            {{ product.description }}
          </p>

          <!-- Precio -->
          <div class="text-xl font-bold text-gray-900">
            Bs {{ product.price }}
          </div>

          <!-- Stock -->
          <div
            class="text-sm font-medium"
            [class.text-green-600]="product.stock > 0"
            [class.text-red-600]="product.stock === 0"
          >
            {{ product.stock > 0 ? 'Stock disponible' : 'Agotado' }}
          </div>
        </div>
      </div>
    </ng-container>
  </div>

</section>
